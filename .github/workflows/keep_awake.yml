name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 5 hours (at minute 0)
    - cron: '0 */5 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Ping Streamlit App with Playwright
        env:
          STREAMLIT_APP_URL: ${{ vars.STREAMLIT_APP_URL || secrets.STREAMLIT_APP_URL || 'https://orderflow-lab.streamlit.app' }}
        run: |
          python << 'EOF'
          import os
          import time
          from playwright.sync_api import sync_playwright

          app_url = os.environ.get("STREAMLIT_APP_URL", "https://orderflow-lab.streamlit.app")
          print(f"Target URL: {app_url}")

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
              )
              page = context.new_page()

              try:
                  print("Navigating with wait_until='domcontentloaded' to avoid WebSocket timeouts...")
                  page.goto(app_url, wait_until='domcontentloaded', timeout=60000)

                  # Brief pause to allow Streamlit client state to render
                  time.sleep(5)

                  wake_button = page.locator("button:has-text('Yes, get this app back up!')")

                  if wake_button.count() > 0 and wake_button.first.is_visible():
                      print("Detected sleeping Streamlit app. Clicking 'Yes, get this app back up!'...")
                      wake_button.first.click()
                      print("Waiting 45 seconds to let the server boot up...")
                      time.sleep(45)
                      print("Wake-up signal completed.")
                  else:
                      print("App is already awake. Keeping session active for 15 seconds to register traffic...")
                      time.sleep(15)
                      print("Traffic successfully registered.")

              except Exception as exc:
                  print(f"Encountered error during keep-awake check: {exc}")
                  raise exc
              finally:
                  browser.close()
                  print("Playwright browser closed.")
          EOF
